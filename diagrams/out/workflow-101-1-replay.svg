<svg class="dapr-diagram-workflow-101-1-replay" font-family="Inter, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 476 321" role="img" aria-labelledby="workflow-101-1-replay-title workflow-101-1-replay-desc"><title id="workflow-101-1-replay-title">What the replay after the restart does with each charge stage</title><desc id="workflow-101-1-replay-desc">Five boxes for the stages of ChargeWarpCoreWorkflow, in two rows. A green start circle named replay has an arrow labelled from the top up to stage 1. Stages 1 and 2 are grey, in a lane named from history. An arrow runs on to stage 3, in a lane named runs again, marked with a red flash and the word crashed. An arrow drops to the second row, to stages 4 and 5 in a lane named first run.</desc><style>.dapr-diagram-workflow-101-1-replay{--d-app-ink:#11161f;--d-blue:#0D2192;--d-blue-fill:#D3D7F0;--d-body:#1c2330;--d-caption:#747474;--d-green:#0bdda3;--d-ground:#ffffff;--d-red:#EE0000;--d-teal:#4EA4AF;--d-teal-fill:#D3E6E6}@media (prefers-color-scheme: dark){.dapr-diagram-workflow-101-1-replay{--d-app-ink:#11161f;--d-blue:#6f9fe8;--d-blue-fill:#1a2347;--d-body:#dfe4ee;--d-caption:#9aa3b2;--d-green:#0bdda3;--d-ground:#0b0e14;--d-red:#ff6b6b;--d-teal:#6cc4cf;--d-teal-fill:#12313a}}</style><g class="d-region"><rect class="d-panel" x="12" y="25" width="280" height="120" rx="10" fill="none" stroke="var(--d-caption)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="32" y="12" width="90" height="26" rx="13" fill="var(--d-ground)" stroke="var(--d-caption)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="77" y="29.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">from history</text></g></g><g class="d-region"><rect class="d-panel" x="316" y="25" width="148" height="120" rx="10" fill="none" stroke="var(--d-caption)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="336" y="12" width="79" height="26" rx="13" fill="var(--d-ground)" stroke="var(--d-caption)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="375.5" y="29.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">runs again</text></g></g><g class="d-region"><rect class="d-panel" x="184" y="189" width="280" height="120" rx="10" fill="none" stroke="var(--d-caption)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="381" y="176" width="63" height="26" rx="13" fill="var(--d-ground)" stroke="var(--d-caption)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="412.5" y="193.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">first run</text></g></g><g class="d-arrow"><line x1="86" y1="223.5" x2="86" y2="113.5" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="89.84,120.52 86,113.5 82.16,120.52" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="98" y="171.55" text-anchor="start" font-size="13" font-weight="600" fill="var(--d-body)">from the top</text><g class="d-arrow"><line x1="136" y1="91.5" x2="168" y2="91.5" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="160.98,95.34 168,91.5 160.98,87.66" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="268" y1="91.5" x2="340" y2="91.5" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="332.98,95.34 340,91.5 332.98,87.66" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="