e-linecap="round"/><text x="390" y="96.05" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">stage 3</text></g><g class="d-box"><rect x="210" y="235.5" width="96" height="40" rx="6" fill="var(--d-teal-fill)" fill-opacity="0.6" stroke="var(--d-teal)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="258" y="260.05" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">stage 4</text></g><g class="d-box"><rect x="342" y="235.5" width="96" height="40" rx="6" fill="var(--d-teal-fill)" fill-opacity="0.6" stroke="var(--d-teal)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="390" y="260.05" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">stage 5</text></g><g class="d-icon-group"><g class="d-icon" data-mark="fluent-flash" transform="translate(353.1972 43.9499) scale(0.9)" fill="var(--d-red)" color="var(--d-red)"><path fill="currentColor" d="M7.425 2.83A1.25 1.25 0 0 1 8.603 2h6.453a1.25 1.25 0 0 1 1.186 1.645L14.79 8h3.96c1.103 0 1.665 1.327.897 2.12L8.586 21.536c-1.054 1.088-2.872.106-2.541-1.372l1.27-5.668l-1.57-.006a1.75 1.75 0 0 1-1.641-2.337zm1.354.67l-3.262 9.157a.25.25 0 0 0 .234.333l2.502.01a.75.75 0 0 1 .729.914l-1.473 6.578L18.159 9.5h-4.41a.75.75 0 0 1-.71-.987l1.67-5.013z"/></g></g><text x="378" y="59.3" text-anchor="start" font-size="13" font-weight="600" fill="var(--d-body)">crashed</text></svg>
