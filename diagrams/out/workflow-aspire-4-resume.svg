<svg class="dapr-diagram-workflow-aspire-4-resume" font-family="Inter, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 -0.09 490 267" role="img" aria-labelledby="workflow-aspire-4-resume-title workflow-aspire-4-resume-desc"><title id="workflow-aspire-4-resume-title">After the stop, the workflow replays its history and carries on</title><desc id="workflow-aspire-4-resume-desc">Three lanes side by side. In the lane named before the stop, a teal box 3 diagnoses. In the lane named app stopped, a gold box 15 s timer under a red flash and the word stop. In the lane named after the restart, a teal box prioritize. Arrows run from box to box. Below the timer is a gold data store with the Redis mark named dapr_redis. An arrow labelled saved runs down from 3 diagnoses to dapr_redis, and an arrow labelled replay runs from dapr_redis up to prioritize.</desc><style>.dapr-diagram-workflow-aspire-4-resume{--d-app-gold:#efca08;--d-app-ink:#11161f;--d-blue:#0D2192;--d-body:#1c2330;--d-caption:#747474;--d-ground:#ffffff;--d-red:#EE0000;--d-teal:#4EA4AF;--d-teal-fill:#D3E6E6}@media (prefers-color-scheme: dark){.dapr-diagram-workflow-aspire-4-resume{--d-app-gold:#efca08;--d-app-ink:#11161f;--d-blue:#6f9fe8;--d-body:#dfe4ee;--d-caption:#9aa3b2;--d-ground:#0b0e14;--d-red:#ff6b6b;--d-teal:#6cc4cf;--d-teal-fill:#12313a}}</style><g class="d-region"><rect class="d-panel" x="12" y="25" width="144.67" height="112" rx="10" fill="none" stroke="var(--d-caption)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="32" y="12" width="109" height="26" rx="13" fill="var(--d-ground)" stroke="var(--d-caption)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="86.5" y="29.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">before the stop</text></g></g><g class="d-region"><rect class="d-panel" x="172.67" y="25" width="144.67" height