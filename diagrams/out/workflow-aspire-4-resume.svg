ll="none"/><polyline points="193.98,201.84 201,198 193.98,194.16" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><text x="153.67" y="190.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">saved</text><g class="d-elbow-arrow"><path class="d-run" d="M289,198 L393.67,198 Q405.67,198 405.67,186 L405.67,115.5" fill="none" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round"/><g class="d-arrow"><line x1="405.67" y1="141.5" x2="405.67" y2="115.5" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="409.5,122.52 405.67,115.5 401.83,122.52" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><text x="336.33" y="190.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">replay</text><g class="d-box"><rect x="28.33" y="73.5" width="112" height="40" rx="6" fill="var(--d-teal-fill)" fill-opacity="0.6" stroke="var(--d-teal)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="84.33" y="98.05" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">3 diagnoses</text></g><g class="d-box"><rect x="189" y="73.5" width="112" height="40" rx="6" fill="var(--d-app-gold)" fill-opacity="0.6" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="245" y="98.05" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">15 s timer</text></g><g class="d-box"><rect x="349.67" y="73.5" width="112" height="40" rx="6" fill="var(--d-teal-fill)" fill-opacity="0.6" stroke="var(--d-teal)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="405.67" y="98.05" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">prioritize</text></g><g class="d-icon-group"><g class="d-icon" data-mark="fluent-flash" transform="translate(217.6972 44.9499) scale(0.9)" fill="var(--d-red)" color="var(--d-red)"><path fill="currentColor" d="M7.425 2.83A1.25 1.25 0 0 1 8.603 2h6.453a1.25 1.25 0 0 1 1.186 1.645L14.79 8h3.96c1.103 0 1.665 1.327.897 2.12L8.586 21.536c-1.054 1.088-2.872.106-2.541-1.372l1.27-5.668l-1.57-.006a1.75 1.75 0 0 1-1.641-2.337zm1.354.67l-3.262 9.157a.25.25 0 0 0 .234.333l2.502.01a.75.75 0 0 1 .729.914l-1.473 6.578L18.159 9.5h-4.41a.75.75 0 0 1-.71-.987l1.67-5.013z"/></g></g><text x="242.5" y="60.3" text-anchor="start" font-size="13" font-weight="600" fill="var(--d-body)">stop</text><g><g class="d-cylinder"><path d="M203,172.66 L203,223.34 A42,9.66 0 0 0 287,223.34 L287,172.66 A42,9.66 0 0 0 203,172.66 Z" fill="var(--d-app-gold)" stroke="none"/><path d="M203,223.34 A42,9.66 0 0 1 287,223.34" fill="none" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 3" stroke-opacity="0.35"/><path d="M203,172.66 L203,223.34 A42,9.66 0 0 0 287,223.34 L287,172.66" fill="none" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="245" cy="172.66" rx="42" ry="9.66" fill="var(--d-app-gold)" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></g><g class="d-icon-group"><g class="d-icon" data-mark="redis" transform="translate(230 183) scale(1.25)" fill="var(--d-app-ink)" color="var(--d-app-ink)"><path fill="currentColor" d="M22.71 13.145c-1.66 2.092-3.452 4.483-7.038 4.483c-3.203 0-4.397-2.825-4.48-5.12c.701 1.484 2.073 2.685 4.214 2.63c4.117-.133 6.94-3.852 6.94-7.239c0-4.05-3.022-6.972-8.268-6.972c-3.752 0-8.4 1.428-11.455 3.685C2.59 6.937 3.885 9.958 4.35 9.626c2.648-1.904 4.748-3.13 6.784-3.744C8.12 9.244.886 17.05 0 18.425c.1 1.261 1.66 4.648 2.424 4.648c.232 0 .431-.133.664-.365a101 101 0 0 0 5.54-6.765c.222 3.104 1.748 6.898 6.014 6.898c3.819 0 7.604-2.756 9.33-8.965c.2-.764-.73-1.361-1.261-.73zm-4.349-5.013c0 1.959-1.926 2.922-3.685