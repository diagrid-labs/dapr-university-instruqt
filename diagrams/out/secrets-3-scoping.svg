<svg class="dapr-diagram-secrets-3-scoping" font-family="Inter, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="2.12 1.68 490 367" role="img" aria-labelledby="secrets-3-scoping-title secrets-3-scoping-desc"><title id="secrets-3-scoping-title">Secret scoping with a sidecar configuration</title><desc id="secrets-3-scoping-desc">Two rows. On top, a green hexagon labelled app-a :5002 sends orderdb-password to its Dapr sidecar on :3501, which passes the request on to a secret store labelled secretstore on the left. Below, a blue hexagon labelled app-b :5003 sends orderdb-password to its own Dapr sidecar on :3502 and gets 403 PERMISSION_DENIED back; that sidecar has no arrow to the store. A plain line joins it to a document under it labelled config-app-b.yaml, with the caption storeName: secretstore, defaultAccess: deny, allowedSecrets: payments-api-key, legacy-api-key.</desc><style>.dapr-diagram-secrets-3-scoping{--d-app-ink:#11161f;--d-app-paper:#ffffff;--d-app-sky:#3ea9f5;--d-blue:#0D2192;--d-body:#1c2330;--d-diagram-plate:#ffffff;--d-green:#0bdda3;--d-sky:#3ea9f5;--d-teal-fill:#D3E6E6}@media (prefers-color-scheme: dark){.dapr-diagram-secrets-3-scoping{--d-app-ink:#11161f;--d-app-paper:#ffffff;--d-app-sky:#3ea9f5;--d-blue:#6f9fe8;--d-body:#dfe4ee;--d-diagram-plate:#e8ebf1;--d-green:#0bdda3;--d-sky:#3ea9f5;--d-teal-fill:#12313a}}</style><g><g class="d-arrow"><line x1="377.01" y1="68" x2="200.91" y2="68" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="207.93,64.16 200.91,68 207.93,71.84" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="288.96" y="60.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">orderdb-password</text><g class="d-arrow"><line x1="124.16" y1="68" x2="78" y2="68" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-