<svg class="dapr-diagram-workflow-aspire-2-workflow" font-family="Inter, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0.09 484 298" role="img" aria-labelledby="workflow-aspire-2-workflow-title workflow-aspire-2-workflow-desc"><title id="workflow-aspire-2-workflow-title">One run of DiagnosticsWorkflow</title><desc id="workflow-aspire-2-workflow-desc">A green start circle has three arrows, labelled fan-out, to three boxes under the heading DiagnoseSubsystemActivity: WarpCore, LifeSupport and Shields. Three arrows, labelled fan-in, lead from them to a gold box, 15 s durable timer. It leads down to PrioritizeDiagnosticsActivity, then to a decision, Urgent?. Yes leads left to NotifyBridgeActivity and on to an orange end circle, done. No runs below the row back to the same end circle.</desc><style>.dapr-diagram-workflow-aspire-2-workflow{--d-app-gold:#efca08;--d-app-ink:#11161f;--d-blue:#0D2192;--d-body:#1c2330;--d-green:#0bdda3;--d-orange:#ff4e00;--d-teal:#4EA4AF;--d-teal-fill:#D3E6E6}@media (prefers-color-scheme: dark){.dapr-diagram-workflow-aspire-2-workflow{--d-app-gold:#efca08;--d-app-ink:#11161f;--d-blue:#6f9fe8;--d-body:#dfe4ee;--d-green:#0bdda3;--d-orange:#ff7a45;--d-teal:#6cc4cf;--d-teal-fill:#12313a}}</style><g class="d-arrow"><line x1="63.48" y1="80.39" x2="115" y2="56" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="110.3,62.47 115,56 107.01,55.54" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="229" y1="56" x2="288" y2="79" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="280.07,80.02 288,79 282.85,72.88" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="66" y1="92" x2="115" y2="92" stroke=