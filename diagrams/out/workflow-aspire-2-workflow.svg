.6" stroke="var(--d-teal)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="184" y="238.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">NotifyBridgeActivity</text></g><g class="d-node"><circle cx="38" cy="234" r="24" fill="var(--d-orange)" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><g class="d-on-fill"><text x="38" y="238.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-app-ink)">done</text></g></g></svg>
