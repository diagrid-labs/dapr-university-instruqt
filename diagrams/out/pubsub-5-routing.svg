one"/></g></g><g class="d-step"><circle cx="238.19" cy="143" r="11" fill="var(--d-app-blue)" stroke="var(--d-app-blue)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><g class="d-on-fill"><text x="238.19" y="147.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-app-paper)">1</text></g></g><text x="255.19" y="147.55" text-anchor="start" font-size="13" font-weight="600" fill="var(--d-body)">poison: 500 RETRY</text><g class="d-elbow-arrow"><path class="d-run" d="M172,84.31 L172,75.15 Q172,66 162.85,66 L58,66 Q46,66 46,78 L46,106" fill="none" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round"/><g class="d-arrow"><line x1="46" y1="86" x2="46" y2="106" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="42.16,98.98 46,106 49.84,98.98" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><g class="d-step"><circle cx="66.8" cy="83" r="11" fill="var(--d-app-blue)" stroke="var(--d-app-blue)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><g class="d-on-fill"><text x="66.8" y="87.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-app-paper)">2</text></g></g><text x="83.8" y="87.55" text-anchor="start" font-size="13" font-weight="600" fill="var(--d-body)">orders-dead</text><g class="d-elbow-arrow"><path class="d-run" d="M32,106 L32,52 Q32,40 44,40 L176,40 Q188,40 188,52 L188,93.55" fill="none" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round"/><g class="d-arrow"><line x1="188" y1="67.55" x2="188" y2="93.55" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="184.16,86.53 188,93.55 191.84,86.53" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><g class="d-step"><circle cx="67.8" cy="23" r="11" fill="var(--d-app-blue)" s