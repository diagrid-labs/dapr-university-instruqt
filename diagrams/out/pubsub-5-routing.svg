<svg class="dapr-diagram-pubsub-5-routing" font-family="Inter, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="1.16 0 500 206" role="img" aria-labelledby="pubsub-5-routing-title pubsub-5-routing-desc"><title id="pubsub-5-routing-title">Routing and dead letters</title><desc id="pubsub-5-routing-desc">A Redis mark labelled pubsub delivers the topic orders to the Dapr sidecar of a blue hexagon labelled shipping; under the sidecar it says 3 retries, 1 s apart. The sidecar calls the shipping app on /orders/express under the rule priority == "express", on /orders/standard, marked default, and on /orders/dead. Step 1: the poison order fails on /orders/standard with 500 RETRY. Step 2: the sidecar sends it to pubsub on orders-dead. Step 3: pubsub delivers orders-dead back to the sidecar, which calls /orders/dead.</desc><style>.dapr-diagram-pubsub-5-routing{--d-app-blue:#0d2192;--d-app-ink:#11161f;--d-app-paper:#ffffff;--d-app-sky:#3ea9f5;--d-blue:#0D2192;--d-body:#1c2330;--d-brand-redis:#FF4438;--d-diagram-plate:#ffffff;--d-sky:#3ea9f5}@media (prefers-color-scheme: dark){.dapr-diagram-pubsub-5-routing{--d-app-blue:#0d2192;--d-app-ink:#11161f;--d-app-paper:#ffffff;--d-app-sky:#3ea9f5;--d-blue:#6f9fe8;--d-body:#dfe4ee;--d-brand-redis:#FF4438;--d-diagram-plate:#e8ebf1;--d-sky:#3ea9f5}}</style><g><g class="d-arrow"><line x1="60" y1="126" x2="129.63" y2="126" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="122.61,129.84 129.63,126 122.61,122.16" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="94.81" y="118.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">orders</text><g class="d-elbow-arrow"><path class="d-run" d="M206.37,112 L212.37,112 Q218.37,112 218.37,106 L218.37,96 Q218.37,84 230.37,84 L411.25,84" fill="none" stroke="var(--d-blue)" stroke-width="1.4" st