<svg class="dapr-diagram-workflow-101-2-chain" font-family="Inter, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 -5.07 476 190" role="img" aria-labelledby="workflow-101-2-chain-title workflow-101-2-chain-desc"><title id="workflow-101-2-chain-title">The four activities of JumpWorkflow, chained</title><desc id="workflow-101-2-chain-desc">Four boxes in two rows: PlotCourseActivity, ChargeWarpCoreActivity, AlignNavArrayActivity and EngageJumpActivity. Arrows labelled course, warp factor and aligned join them in order. A second arrow, labelled course + warp factor, runs from ChargeWarpCoreActivity down to EngageJumpActivity.</desc><style>.dapr-diagram-workflow-101-2-chain{--d-blue:#0D2192;--d-body:#1c2330;--d-teal:#4EA4AF;--d-teal-fill:#D3E6E6}@media (prefers-color-scheme: dark){.dapr-diagram-workflow-101-2-chain{--d-blue:#6f9fe8;--d-body:#dfe4ee;--d-teal:#6cc4cf;--d-teal-fill:#12313a}}</style><g class="d-arrow"><line x1="190" y1="32" x2="286" y2="32" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="278.98,35.84 286,32 278.98,28.16" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="238" y="22.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">course</text><g class="d-elbow-arrow"><path class="d-run" d="M336,54 L336,69 Q336,81 324,81 L112,81 Q100,81 100,93 L100,128" fill="none" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round"/><g class="d-arrow"><line x1="100" y1="104.5" x2="100" y2="128" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="96.16,120.98 100,128 103.84,120.98" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><text x="218" y="101.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">warp factor</text><g class="d-arrow"><line x1="190" y1="150" x2="286" y2="150" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="278.98,153.84 286,150 278.98,146.16" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="238" y="140.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">aligned</text><g class="d-arrow"><line x1="416" y1="54" x2="416" y2="128" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="412.16,120.98 416,128 419.84,120.98" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="408" y="97.75" text-anchor="end" font-size="13" font-weight="600" fill="var(--d-body)"><tspan x="408">course +</tspan><tspan x="408" dy="15.6">warp factor</tspan></text><g class="d-box"><rect x="12" y="12" width="176" height="40" rx="6" fill="var(--d-teal-fill)" fill-opacity="0.6" stroke="var(--d-teal)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="100" y="36.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">PlotCourseActivity</text></g><g class="d-box"><rect x="288" y="12" width="176" height="40" rx="6" fill="var(--d-teal-fill)" fill-opacity="0.6" stroke="var(--d-teal)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="376" y="36.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">ChargeWarpCoreActivity</text></g><g class="d-box"><rect x="12" y="130" width="176" height="40" rx="6" fill="var(--d-teal-fill)" fill-opacity="0.6" stroke="var(--d-teal)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="100" y="154.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">AlignNavArrayActivity</text></g><g class="d-box"><rect x="288" y="130" width="176" height="40" rx="6" fill="var(--d-teal-fill)" fill-opacity="0.6" stroke="var(--d-teal)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="376" y="154.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">EngageJumpActivity</text></g></svg>
