<svg class="dapr-diagram-workflow-101-4-monitor" font-family="Inter, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 -6.5 476 337" role="img" aria-labelledby="workflow-101-4-monitor-title workflow-101-4-monitor-desc"><title id="workflow-101-4-monitor-title">One run of CoreStabilityWorkflow, the monitor pattern</title><desc id="workflow-101-4-monitor-desc">Inside a lane named CoreStabilityWorkflow, a green start circle named check n leads to ReadCoreTempActivity, which returns coreTempK to a decision named stable?, with the condition 1000K or less. Yes, 1000K or less, leads to a small orange end circle named stable true. No leads to a second decision, check 10?: yes leads to a small orange end circle named stable false. No leads to a box, 5 s durable timer, and an arrow named continue-as-new, check n plus 1, returns to the start.</desc><style>.dapr-diagram-workflow-101-4-monitor{--d-app-gold:#efca08;--d-app-ink:#11161f;--d-blue:#0D2192;--d-body:#1c2330;--d-caption:#747474;--d-green:#0bdda3;--d-ground:#ffffff;--d-orange:#ff4e00;--d-teal:#4EA4AF;--d-teal-fill:#D3E6E6}@media (prefers-color-scheme: dark){.dapr-diagram-workflow-101-4-monitor{--d-app-gold:#efca08;--d-app-ink:#11161f;--d-blue:#6f9fe8;--d-body:#dfe4ee;--d-caption:#9aa3b2;--d-green:#0bdda3;--d-ground:#0b0e14;--d-orange:#ff7a45;--d-teal:#6cc4cf;--d-teal-fill:#12313a}}</style><g class="d-region"><rect class="d-panel" x="12" y="12" width="452" height="313" rx="10" fill="none" stroke="var(--d-caption)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="32" y="-1" width="176" height="26" rx="13" fill="var(--d-ground)" stroke="var(--d-caption)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="120" y="16.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">CoreStabilityWorkflow</text></g></g><g class="d-arrow"><line x1="102" y1="63" x2="148" y2="63" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="140.98,66.84 148,63 140.98,59.16" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="238" y1="85" x2="238" y2="112" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="234.16,104.98 238,112 241.84,104.98" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="246" y="103.05" text-anchor="start" font-size="13" font-weight="600" fill="var(--d-body)">coreTempK</text><g class="d-arrow"><line x1="288" y1="139" x2="388" y2="139" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="380.98,142.84 388,139 380.98,135.16" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="338" y="129.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">yes, ≤ 1000K</text><g class="d-arrow"><line x1="238" y1="166" x2="238" y2="188" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="234.16,180.98 238,188 241.84,180.98" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="246" y="181.55" text-anchor="start" font-size="13" font-weight="600" fill="var(--d-body)">no</text><g class="d-arrow"><line x1="296" y1="215" x2="388" y2="215" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="380.98,218.84 388,215 380.98,211.16" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="342" y="205.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">yes</text><g class="d-arrow"><line x1="238" y1="242" x2="238" y2="269" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="234.16,261.98 238,269 241.84,261.98" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="246" y="260.05" text-anchor="start" font-size="13" font-weight="600" fill="var(--d-body)">no</text><g class="d-elbow-arrow"><path class="d-run" d="M148,291 L82,291 Q70,291 70,279 L70,95" fill="none" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round"/><g class="d-arrow"><line x1="70" y1="121" x2="70" y2="95" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="73.84,102.02 70,95 66.16,102.02" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><text x="80" y="108.75" text-anchor="start" font-size="13" font-weight="600" fill="var(--d-body)"><tspan x="80">continue-as-new</tspan><tspan x="80" dy="15.6">check n + 1</tspan></text><g class="d-node"><circle cx="70" cy="63" r="30" fill="var(--d-green)" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><g class="d-on-fill"><text x="70" y="67.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-app-ink)">check n</text></g></g><g class="d-box"><rect x="150" y="43" width="176" height="40" rx="6" fill="var(--d-teal-fill)" fill-opacity="0.6" stroke="var(--d-teal)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="238" y="67.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">ReadCoreTempActivity</text></g><g class="d-decision"><polygon points="238,114 286,139 238,164 190,139" fill="var(--d-app-gold)" fill-opacity="0.6" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="238" y="143.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">stable?</text></g><g class="d-decision"><polygon points="238,190 294,215 238,240 182,215" fill="var(--d-app-gold)" fill-opacity="0.6" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="238" y="219.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">check 10?</text></g><g class="d-box"><rect x="150" y="271" width="176" height="40" rx="6" fill="var(--d-app-gold)" fill-opacity="0.6" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="238" y="295.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">5 s durable timer</text></g><g class="d-node"><circle cx="406" cy="139" r="16" fill="var(--d-orange)" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="406" y="173.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">stable: true</text></g><g class="d-node"><circle cx="406" cy="215" r="16" fill="var(--d-orange)" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="406" y="249.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">stable: false</text></g></svg>
