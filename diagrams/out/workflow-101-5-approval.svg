<svg class="dapr-diagram-workflow-101-5-approval" font-family="Inter, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 476 341" role="img" aria-labelledby="workflow-101-5-approval-title workflow-101-5-approval-desc"><title id="workflow-101-5-approval-title">AuthorizedJumpWorkflow waits for the captain, the human in the loop pattern</title><desc id="workflow-101-5-approval-desc">A box named captain, POST /jumps/{jumpId}/authorize, sits above a lane named AuthorizedJumpWorkflow and has an arrow into a gold box in the lane, jump-authorized, 60 s timeout. In the lane, PlotCourseActivity leads to that wait. From the wait, an arrow named event leads to a decision, approved?, and an arrow named timeout leads to an end circle, ABORTED_NO_AUTHORIZATION. From the decision, no leads to an end circle, DENIED, and yes leads to EngageJumpActivity and then to an end circle, JUMPED.</desc><style>.dapr-diagram-workflow-101-5-approval{--d-app-gold:#efca08;--d-app-ink:#11161f;--d-blue:#0D2192;--d-blue-fill:#D3D7F0;--d-body:#1c2330;--d-caption:#747474;--d-ground:#ffffff;--d-orange:#ff4e00;--d-teal:#4EA4AF;--d-teal-fill:#D3E6E6}@media (prefers-color-scheme: dark){.dapr-diagram-workflow-101-5-approval{--d-app-gold:#efca08;--d-app-ink:#11161f;--d-blue:#6f9fe8;--d-blue-fill:#1a2347;--d-body:#dfe4ee;--d-caption:#9aa3b2;--d-ground:#0b0e14;--d-orange:#ff7a45;--d-teal:#6cc4cf;--d-teal-fill:#12313a}}</style><g class="d-region"><rect class="d-panel" x="12" y="86" width="452" height="243" rx="10" fill="none" stroke="var(--d-caption)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="32" y="73" width="176" height="26" rx="13" fill="var(--d-ground)" stroke="var(--d-caption)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="120" y="90.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">AuthorizedJumpWorkflow</text></g></g><g class="d-arrow"><line x1="330" y1="58" x2="330" y2="107" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="326.16,99.98 330,107 333.84,99.98" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="204" y1="134" x2="240" y2="134" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="232.98,137.84 240,134 232.98,130.16" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="330" y1="161" x2="330" y2="185" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="326.16,177.98 330,185 333.84,177.98" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="338" y="177.55" text-anchor="start" font-size="13" font-weight="600" fill="var(--d-body)">event</text><g class="d-elbow-arrow"><path class="d-run" d="M262,161 L262,200 Q262,212 250,212 L138,212" fill="none" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round"/><g class="d-arrow"><line x1="164" y1="212" x2="138" y2="212" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="145.02,208.16 138,212 145.02,215.84" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><text x="199" y="202.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">timeout</text><g class="d-arrow"><line x1="378" y1="212" x2="406" y2="212" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="398.98,215.84 406,212 398.98,208.16" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="392" y="202.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">no</text><g class="d-arrow"><line x1="330" y1="239" x2="330" y2="263" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="326.16,255.98 330,263 333.84,255.98" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="338" y="255.55" text-anchor="start" font-size="13" font-weight="600" fill="var(--d-body)">yes</text><g class="d-arrow"><line x1="246" y1="285" x2="138" y2="285" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="145.02,281.16 138,285 145.02,288.84" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-box"><rect x="248" y="12" width="164" height="44" rx="6" fill="var(--d-blue-fill)" fill-opacity="0.6" stroke="var(--d-caption)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="330" y="30.75" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)"><tspan x="330">captain</tspan><tspan x="330" dy="15.6">POST …/authorize</tspan></text></g><g class="d-box"><rect x="38" y="114" width="164" height="40" rx="6" fill="var(--d-teal-fill)" fill-opacity="0.6" stroke="var(--d-teal)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="120" y="138.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">PlotCourseActivity</text></g><g class="d-box"><rect x="242" y="109" width="176" height="50" rx="6" fill="var(--d-app-gold)" fill-opacity="0.6" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="330" y="130.75" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)"><tspan x="330">jump-authorized</tspan><tspan x="330" dy="15.6">60 s timeout</tspan></text></g><g class="d-decision"><polygon points="330,187 376,212 330,237 284,212" fill="var(--d-app-gold)" fill-opacity="0.6" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="330" y="216.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">approved?</text></g><g class="d-box"><rect x="248" y="265" width="164" height="40" rx="6" fill="var(--d-teal-fill)" fill-opacity="0.6" stroke="var(--d-teal)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="330" y="289.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">EngageJumpActivity</text></g><g class="d-node"><circle cx="120" cy="212" r="16" fill="var(--d-orange)" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="120" y="246.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">ABORTED_NO_AUTHORIZATION</text></g><g class="d-node"><circle cx="424" cy="212" r="16" fill="var(--d-orange)" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="424" y="246.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">DENIED</text></g><g class="d-node"><circle cx="120" cy="285" r="16" fill="var(--d-orange)" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="120" y="319.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">JUMPED</text></g></svg>
