<svg class="dapr-diagram-workflow-101-6-lifecycle" font-family="Inter, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="11.55 -2.07 476 294" role="img" aria-labelledby="workflow-101-6-lifecycle-title workflow-101-6-lifecycle-desc"><title id="workflow-101-6-lifecycle-title">The states of a jump and the operations between them</title><desc id="workflow-101-6-lifecycle-desc">Five state boxes. RUNNING and SUSPENDED sit on top with arrows between them named pause and resume. COMPLETED and TERMINATED sit below. RUNNING has an arrow named complete to COMPLETED and an arrow named terminate to TERMINATED; SUSPENDED has an arrow named terminate to TERMINATED. PURGED sits at the bottom, with an arrow named purge from COMPLETED and one from TERMINATED.</desc><style>.dapr-diagram-workflow-101-6-lifecycle{--d-app-gold:#efca08;--d-app-ink:#11161f;--d-blue:#0D2192;--d-blue-fill:#D3D7F0;--d-body:#1c2330;--d-caption:#747474;--d-teal:#4EA4AF;--d-teal-fill:#D3E6E6}@media (prefers-color-scheme: dark){.dapr-diagram-workflow-101-6-lifecycle{--d-app-gold:#efca08;--d-app-ink:#11161f;--d-blue:#6f9fe8;--d-blue-fill:#1a2347;--d-body:#dfe4ee;--d-caption:#9aa3b2;--d-teal:#6cc4cf;--d-teal-fill:#12313a}}</style><g class="d-arrow"><line x1="176" y1="30" x2="300" y2="30" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="292.98,33.84 300,30 292.98,26.16" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="238" y="20.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">pause</text><g class="d-arrow"><line x1="300" y1="46" x2="176" y2="46" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="183.02,42.16 176,46 183.02,49.84" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><