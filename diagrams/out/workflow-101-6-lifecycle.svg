,256.16" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><text x="142.5" y="250.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">purge</text><g class="d-elbow-arrow"><path class="d-run" d="M377,180 L377,248 Q377,260 365,260 L300,260" fill="none" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round"/><g class="d-arrow"><line x1="326" y1="260" x2="300" y2="260" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="307.02,256.16 300,260 307.02,263.84" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><text x="333.5" y="250.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">purge</text><g class="d-box"><rect x="24" y="16" width="150" height="44" rx="6" fill="var(--d-teal-fill)" fill-opacity="0.6" stroke="var(--d-teal)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="99" y="42.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">RUNNING</text></g><g class="d-box"><rect x="302" y="16" width="150" height="44" rx="6" fill="var(--d-app-gold)" fill-opacity="0.6" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="377" y="42.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">SUSPENDED</text></g><g class="d-box"><rect x="24" y="134" width="150" height="44" rx="6" fill="var(--d-blue-fill)" fill-opacity="0.6" stroke="var(--d-caption)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="99" y="160.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">COMPLETED</text></g><g class="d-box"><rect x="302" y="134" width="150" height="44" rx="6" fill="var(--d-blue-fill)" fill-opacity="0.6" stroke="var(--d-caption)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="377" y="160.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">TERMINATED</text></g><g class="d-box"><rect x="178" y="238" width="120" height="44" rx="6" fill="var(--d-blue-fill)" fill-opacity="0.6" stroke="var(--d-caption)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="238" y="264.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">PURGED</text></g></svg>
