<svg class="dapr-diagram-pubsub-1-pattern" font-family="Inter, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="4.75 0 480 333" role="img" aria-labelledby="pubsub-1-pattern-title pubsub-1-pattern-desc"><title id="pubsub-1-pattern-title">The publish and subscribe pattern</title><desc id="pubsub-1-pattern-desc">A green hexagon labelled Publisher sends a message through a pill labelled Input channel to a green tube labelled Message broker. From the broker an arrow turns down to a pill labelled Output channel, and from there the line splits into three arrows, one to each of three blue hexagons labelled Subscriber, so every subscriber gets a copy.</desc><style>.dapr-diagram-pubsub-1-pattern{--d-app-ink:#11161f;--d-app-paper:#ffffff;--d-app-sky:#3ea9f5;--d-blue:#0D2192;--d-body:#1c2330;--d-green:#0bdda3;--d-ground:#ffffff}@media (prefers-color-scheme: dark){.dapr-diagram-pubsub-1-pattern{--d-app-ink:#11161f;--d-app-paper:#ffffff;--d-app-sky:#3ea9f5;--d-blue:#6f9fe8;--d-body:#dfe4ee;--d-green:#0bdda3;--d-ground:#0b0e14}}</style><g><g class="d-arrow"><line x1="140.5" y1="68" x2="188.5" y2="68" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="181.48,71.84 188.5,68 181.48,64.16" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="291.5" y1="68" x2="330" y2="68" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="322.98,71.84 330,68 322.98,64.16" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-elbow-arrow"><path class="d-run" d="M390,94 L390,120 Q390,132 378,132 L297,132" fill="none" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round"/><g class="d-arrow"><line x1="323" y1="132" x2="297" y2="132" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="304.02,128.16 297,132 304.02,135.84" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><g class="d-arrow"><line x1="240" y1="147" x2="240" y2="207" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="236.16,199.98 240,207 243.84,199.98" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-elbow-arrow"><path class="d-run" d="M240,147 L240,159 Q240,171 228,171 L102,171 Q90,171 90,183 L90,207" fill="none" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round"/><g class="d-arrow"><line x1="90" y1="189" x2="90" y2="207" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="86.16,199.98 90,207 93.84,199.98" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><g class="d-elbow-arrow"><path class="d-run" d="M240,147 L240,159 Q240,171 252,171 L378,171 Q390,171 390,183 L390,207" fill="none" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round"/><g class="d-arrow"><line x1="390" y1="189" x2="390" y2="207" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="386.16,199.98 390,207 393.84,199.98" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><g class="d-hex d-hex-solid"><polygon points="90,12 138.5,40 138.5,96 90,124 41.5,96 41.5,40" fill="var(--d-green)" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="90" y="72.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-app-ink)">Publisher</text></g><g class="d-pill"><rect x="190.5" y="55" width="99" height="26" rx="13" fill="var(--d-ground)" stroke="var(--d-blue)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="240" y="72.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">Input channel</text></g><g class="d-pipe"><path d="M342,44 L438,44 A10,24 0 0 1 438,92 L342,92 A10,24 0 0 1 342,44 Z" fill="var(--d-green)" stroke="none"/><path d="M438,44 A10,24 0 0 0 438,92" fill="none" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 3" stroke-opacity="0.35"/><path d="M342,44 L438,44 A10,24 0 0 1 438,92 L342,92" fill="none" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="342" cy="68" rx="10" ry="24" fill="var(--d-green)" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><g class="d-on-fill"><text x="390" y="64.75" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-app-ink)"><tspan x="390">Message</tspan><tspan x="390" dy="15.6">broker</tspan></text></g></g><g class="d-pill"><rect x="185" y="119" width="110" height="26" rx="13" fill="var(--d-ground)" stroke="var(--d-blue)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="240" y="136.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">Output channel</text></g><g class="d-hex d-hex-solid"><polygon points="90,209 138.5,237 138.5,293 90,321 41.5,293 41.5,237" fill="var(--d-app-sky)" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="90" y="269.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-app-paper)">Subscriber</text></g><g class="d-hex d-hex-solid"><polygon points="240,209 288.5,237 288.5,293 240,321 191.5,293 191.5,237" fill="var(--d-app-sky)" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="240" y="269.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-app-paper)">Subscriber</text></g><g class="d-hex d-hex-solid"><polygon points="390,209 438.5,237 438.5,293 390,321 341.5,293 341.5,237" fill="var(--d-app-sky)" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="390" y="269.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-app-paper)">Subscriber</text></g></g></svg>
