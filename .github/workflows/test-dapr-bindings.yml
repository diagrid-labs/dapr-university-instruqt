name: Test dapr-bindings track

on:
  schedule:
    - cron: '45 6 * * *'   # Daily 06:45 UTC (staggered 15 min after dapr-workflow-aspire)
  workflow_dispatch:
  pull_request:
    paths:
      - 'dapr-bindings/**'
      - 'tools/track-tester/**'
      - '.github/workflows/test-dapr-bindings.yml'

permissions:
  contents: read
  issues: write

jobs:
  docsync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync harness
        run: (cd tools/track-tester && uv sync)
      - name: Check doc-sync for all runnable challenges
        run: |
          cd tools/track-tester
          mkdir -p results
          # Check every challenge even if an earlier one drifts, so one report shows
          # all drift (the `if !` guard is exempt from `set -e`, so the loop continues).
          failed=""
          for ch in 1-introduction 2-save-state 3-query-state; do
            if ! uv run python docsync/check_doc_sync.py \
              ../../dapr-bindings/$ch/assignment.md \
              ../../dapr-bindings/$ch/tests/challenge.robot; then
              failed="$failed $ch"
            fi
          done
          if [ -n "$failed" ]; then
            echo "docsync:$failed" > results/failed-docsync.txt
            echo "::error::doc-sync drift in:$failed"
            exit 1
          fi
      - name: Upload doc-sync failure summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failures-docsync
          path: tools/track-tester/results/failed-docsync.txt
          if-no-files-found: ignore

  agnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Setup Dapr + Postgres sandbox
        run: bash tools/track-tester/ci/setup-dapr-bindings.sh
      - name: Sync harness
        run: (cd tools/track-tester && uv sync)
      - name: Run challenge 1
        run: |
          cd tools/track-tester
          mkdir -p results
          uv run robot --outputdir results --name "dapr-bindings (agnostic)" \
            ../../dapr-bindings/1-introduction/tests/challenge.robot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-agnostic
          path: tools/track-tester/results/

  languages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [python, dotnet, java]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        if: matrix.lang == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up .NET
        if: matrix.lang == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Set up Java
        if: matrix.lang == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The sample repo is cloned into $HOME at runtime (outside the workspace), so
      # setup-java's built-in `cache: maven` can't find its pom to key on. Cache ~/.m2
      # explicitly instead, with a per-run key and a prefix restore-key.
      - name: Cache Maven repository
        if: matrix.lang == 'java'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-dapr-bindings-${{ github.run_id }}
          restore-keys: |
            maven-dapr-bindings-
      - name: Setup Dapr + Postgres sandbox
        run: bash tools/track-tester/ci/setup-dapr-bindings.sh
      - name: Sync harness
        run: (cd tools/track-tester && uv sync)
      # Pre-warm Maven outside the suite's timed readiness wait, so a cold ~/.m2 download
      # can't eat into the time the app has to start.
      - name: Pre-warm Maven dependencies
        if: matrix.lang == 'java'
        run: mvn -q -B -f "$AI_AGENT_TRACKS_DIR/bindings/venue-bookings/java/pom.xml" dependency:go-offline
      - name: Run challenges 2 and 3 for ${{ matrix.lang }}
        run: |
          cd tools/track-tester
          mkdir -p results
          # Challenges share the same Postgres container within a run, like a learner going
          # through the track in order, so both go into a single invocation.
          uv run robot --outputdir results --name "dapr-bindings (${{ matrix.lang }})" \
            --include ${{ matrix.lang }} \
            ../../dapr-bindings/2-save-state/tests/challenge.robot \
            ../../dapr-bindings/3-query-state/tests/challenge.robot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-${{ matrix.lang }}
          path: tools/track-tester/results/

  report:
    needs: [docsync, agnostic, languages]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = 'Dapr Bindings track drift detected';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The dapr-bindings drift test **failed**.`,
              ``,
              `- Run: ${runUrl}`,
              `- Download the \`robot-<leg>\` artifact for the failing leg (\`agnostic\`, \`python\`, \`dotnet\` or \`java\`), or \`failures-docsync\` for doc-sync, and open \`report.html\` (every challenge listed; failures in red) or \`log.html\`.`,
              ``,
              `Download and open a report:`,
              '```bash',
              `gh run download ${context.runId} -n robot-python -D ./report-python`,
              '```',
              ``,
              `_This issue is updated automatically each run._`,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'drift-report',
            });
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: match.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['drift-report'],
              });
            }
