name: Test dapr-secrets track

on:
  schedule:
    - cron: '45 6 * * *'   # Daily 06:45 UTC (staggered after dapr-101 06:00, dapr-workflow 06:15, dapr-workflow-aspire 06:30)
  workflow_dispatch:
  pull_request:
    paths:
      - 'dapr-secrets/**'
      - 'tools/track-tester/**'
      - '.github/workflows/test-dapr-secrets.yml'

permissions:
  contents: read
  issues: write

jobs:
  docsync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync harness
        run: (cd tools/track-tester && uv sync)
      - name: Check doc-sync for all runnable challenges
        run: |
          cd tools/track-tester
          mkdir -p results
          # Check every challenge even if an earlier one drifts, so one report shows
          # all drift (the `if !` guard is exempt from `set -e`, so the loop continues).
          failed=""
          for ch in 1-what-is-the-secrets-api 2-component-and-parameters \
                    3-secret-scoping 4-swap-the-provider; do
            if ! uv run python docsync/check_doc_sync.py \
              ../../dapr-secrets/$ch/assignment.md \
              ../../dapr-secrets/$ch/tests/challenge.robot; then
              failed="$failed $ch"
            fi
          done
          if [ -n "$failed" ]; then
            # Record for the aggregate issue, then fail the job.
            echo "docsync:$failed" > results/failed-docsync.txt
            echo "::error::doc-sync drift in:$failed"
            exit 1
          fi
      - name: Upload doc-sync failure summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failures-docsync
          path: tools/track-tester/results/failed-docsync.txt
          if-no-files-found: ignore

  languages:
    runs-on: ubuntu-latest
    # Bounds a hung Vault pull, `dapr init` or app start (the cold Vault pull is unmeasured) so a
    # stuck leg costs 45 minutes of runner time rather than the 6-hour default.
    timeout-minutes: 45
    env:
      # The demo repo is checked out INSIDE the workspace (next step) rather than cloned to $HOME
      # by the setup script. hashFiles() can only see files under the workspace, and the Maven
      # cache key below needs the demo poms. ci/setup-dapr-secrets.sh skips its own clone when
      # this directory already holds a checkout.
      TRACKS_SRC_DIR: ${{ github.workspace }}/ai-agent-tracks-instruqt
    strategy:
      fail-fast: false
      matrix:
        lang: [dotnet, java, python]
    steps:
      - uses: actions/checkout@v4
      # Deliberately NOT pinned with `ref:`. This harness exists to catch the demo code and the
      # assignments drifting apart; a pinned checkout would test a frozen snapshot forever and be
      # blind to exactly that. The cost (a PR is tested against a moving demo main) is accepted.
      # The demo repo is public, so the default GITHUB_TOKEN is sufficient; no PAT is needed.
      - uses: actions/checkout@v4
        with:
          repository: diagrid-labs/ai-agent-tracks-instruqt
          path: ai-agent-tracks-instruqt
      - uses: astral-sh/setup-uv@v5
      # 10.0.x only (test-dapr-workflow.yml installs 8.0.x and 9.0.x): the dapr-secrets .NET demos
      # target net10.0, so older SDKs cannot build them.
      - name: Set up .NET
        id: dotnet
        if: matrix.lang == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Set up Java
        id: jdk
        if: matrix.lang == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # setup-java's built-in `cache: maven` would not reliably find these poms, so cache ~/.m2
      # explicitly. The key is the hash of the demo poms (inside the workspace, see TRACKS_SRC_DIR
      # above); a prefix restore-key still restores the newest older cache when a pom changes,
      # so only the delta is downloaded.
      - name: Cache Maven repository
        if: matrix.lang == 'java'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-daprsecrets-${{ hashFiles('ai-agent-tracks-instruqt/secrets/java/**/pom.xml') }}
          restore-keys: |
            maven-daprsecrets-
      - name: Set up Python
        id: py
        if: matrix.lang == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Runs a full `dapr init` (Docker is preinstalled on ubuntu-latest), starts and seeds the
      # hashicorp/vault container the suites need (port 8200), then fails if the runtime that came
      # up is not the pinned MAJOR.MINOR. A cold pull of the ~526 MB Vault image happens inside
      # this step, before the script's 30 s readiness loop starts.
      #
      # The Dapr install is deliberately unpinned (see the script): the suites assert what a learner
      # gets today, so a new Dapr minor turns the runtime guard red. That is the correct signal; the
      # step below makes it legible. Output is teed to a log so the failing reason can be recorded.
      - name: Setup Dapr sandbox
        id: setup
        shell: bash
        run: |
          mkdir -p tools/track-tester/results
          bash tools/track-tester/ci/setup-dapr-secrets.sh 2>&1 | tee tools/track-tester/results/setup.log
      - name: Sync harness
        id: sync
        run: (cd tools/track-tester && uv sync)
      # Pre-warm the Maven cache OUTSIDE the harness's timed run, as the dapr-workflow Java leg
      # does. The Java apps start via Maven under an app-readiness timeout; on a cold ~/.m2 the
      # dependency download would eat into time that also has to cover compile and startup.
      # Demo3-SwapProvider reuses the Demo1 app, so these three poms cover all four challenges.
      - name: Pre-warm Maven dependencies
        id: prewarm
        if: matrix.lang == 'java'
        run: |
          JAVA_BASE="$TRACKS_SRC_DIR/secrets/java"
          for proj in Demo1-ReadSecret Demo2-Scoping/AppA Demo2-Scoping/AppB; do
            echo "::group::go-offline $proj"
            mvn -q -B -f "$JAVA_BASE/$proj/pom.xml" dependency:go-offline
            echo "::endgroup::"
          done
      # Any failure BEFORE the results loop (toolchain setup, the Dapr/Vault setup script, `uv sync`,
      # the Maven pre-warm) writes no failed-<lang>.txt, so the report job would open an issue with
      # no cause in it. Record one here. Conditioned on failure() || cancelled() rather than on a
      # step's `failure` outcome, so a cancelled step (e.g. one killed by a timeout) is recorded too.
      # It sits before the run step, so it cannot fire for an ordinary test failure.
      - name: Record pre-test failure
        if: failure() || cancelled()
        shell: bash
        env:
          OUTCOMES: >-
            Set-up-.NET=${{ steps.dotnet.outcome }}
            Set-up-Java=${{ steps.jdk.outcome }}
            Set-up-Python=${{ steps.py.outcome }}
            Setup-Dapr-sandbox=${{ steps.setup.outcome }}
            Sync-harness=${{ steps.sync.outcome }}
            Pre-warm-Maven=${{ steps.prewarm.outcome }}
        run: |
          mkdir -p tools/track-tester/results
          step=""
          for o in $OUTCOMES; do
            case "${o#*=}" in success|skipped|"") ;; *) step="${o%%=*}"; break ;; esac
          done
          step="${step//-/ }"
          reason=""
          if [ "$step" = "Setup Dapr sandbox" ]; then
            # The script's first `ERROR:` line; for the runtime guard it names both versions.
            reason="$(grep -m1 '^ERROR:' tools/track-tester/results/setup.log 2>/dev/null || true)"
          fi
          [ -n "$reason" ] || reason="step '${step:-unknown}' did not succeed; see its log"
          # Reasons are rendered inside backticks in the issue; neutralise any backtick.
          reason="${reason//\`/\'}"
          echo "${{ matrix.lang }}: setup-failed: $reason" > tools/track-tester/results/failed-${{ matrix.lang }}.txt
          echo "::error::Pre-test failure (${{ matrix.lang }}): $reason"
      - name: Run all secrets challenges for ${{ matrix.lang }}
        run: |
          cd tools/track-tester
          mkdir -p results
          # Run every challenge even if an earlier one fails, so a single run reports all
          # failing challenges for this language (the `if !` guard is exempt from `set -e`,
          # so the loop keeps going). Fail the job at the end if any challenge failed.
          failed=""
          # One list drives both the run loop and the dry run below.
          challenges="1-what-is-the-secrets-api:ch1 2-component-and-parameters:ch2 3-secret-scoping:ch3 4-swap-the-provider:ch4"
          for ch in $challenges; do
            dir="${ch%%:*}"; out="${ch##*:}"
            if ! uv run robot --outputdir "results/$out" --include ${{ matrix.lang }} \
              "../../dapr-secrets/$dir/tests/challenge.robot"; then
              failed="$failed $dir"
            fi
          done
          # Merge the per-challenge results into one indexed report. `|| true` because rebot's
          # exit code reflects test failures too.
          uv run rebot --outputdir results --output output.xml --name "dapr-secrets (${{ matrix.lang }})" \
            results/ch*/output.xml || true
          # Guard against a green run that tested nothing (a filter matching no tests, or a future
          # Skip). A dry run of the same suites and filter gives the expected test count; the merged
          # result must contain exactly that many tests, none skipped. Test FAILURES are not judged
          # here (robot's own exit code in the loop above already fails the leg for those).
          suites=""
          for ch in $challenges; do suites="$suites ../../dapr-secrets/${ch%%:*}/tests/challenge.robot"; done
          uv run robot --dryrun --include ${{ matrix.lang }} --output results/expected.xml \
            --log NONE --report NONE $suites > /dev/null || true
          if ! uv run python - results/expected.xml results/output.xml <<'PY'
          import sys
          from robot.api import ExecutionResult
          exp = ExecutionResult(sys.argv[1]).statistics.total
          got = ExecutionResult(sys.argv[2]).statistics.total
          print(f"expected {exp.total} tests, merged result has {got.total} (passed {got.passed}, failed {got.failed}, skipped {got.skipped})")
          ok = exp.total > 0 and got.total == exp.total and got.skipped == 0
          sys.exit(0 if ok else 1)
          PY
          then
            echo "::error::Test count mismatch for ${{ matrix.lang }}: no tests ran, the count differs from the dry run, or a test was skipped"
            failed="$failed count-mismatch"
          fi
          if [ -n "$failed" ]; then
            # Record for the aggregate issue, then fail the job.
            echo "${{ matrix.lang }}:$failed" > results/failed-${{ matrix.lang }}.txt
            echo "::error::Failed challenges (${{ matrix.lang }}):$failed"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-${{ matrix.lang }}
          path: tools/track-tester/results/
          if-no-files-found: ignore

  report:
    needs: [docsync, languages]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download failure summaries
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            // Each failing leg wrote a `failed-<leg>.txt` (e.g. "python: 5-monitor")
            // into its artifact; gather them so the issue names the exact failures.
            const lines = [];
            const root = 'artifacts';
            const walk = (dir) => {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const p = path.join(dir, entry.name);
                if (entry.isDirectory()) walk(p);
                else if (/^failed-.*\.txt$/.test(entry.name)) {
                  const txt = fs.readFileSync(p, 'utf8').trim();
                  if (txt) lines.push(txt);
                }
              }
            };
            if (fs.existsSync(root)) walk(root);
            lines.sort();
            const details = lines.length
              ? lines.map(l => `  - \`${l.replace(/`/g, "'")}\``).join('\n')
              : '  - (no per-challenge detail captured — check the failing job logs)';
            // Build one `gh run download` line per failing leg that produced a robot
            // report (docsync uploads only a text summary, no report). Each downloads
            // into its own ./report-<leg> folder so multiple reports can co-exist.
            const reportLegs = [...new Set(lines.map(l => l.split(':')[0].trim()))]
              .filter(leg => leg && leg !== 'docsync');
            const downloadCmds = reportLegs.length
              ? reportLegs.map(leg => `gh run download ${context.runId} -n robot-${leg} -D ./report-${leg}`).join('\n')
              : '# doc-sync failure only: no robot report; see the docsync job log';
            // A setup failure (runtime guard, Vault, missing demo folder) is not drift in the
            // assignments; give it its own title and intro so a maintainer can tell them apart.
            const setupLines = lines.filter(l => l.includes('setup-failed'));
            const setupOnly = lines.length > 0 && setupLines.length === lines.length;
            const title = setupOnly
              ? 'Dapr Secrets track setup failed'
              : 'Dapr Secrets track drift detected';
            const intro = setupOnly
              ? `The dapr-secrets leg(s) **failed before any challenge ran**, so nothing was tested. The assignments may be fine: this is the environment, or Dapr itself has moved. If the reason names a runtime newer than the pin, that is the intended signal that Dapr moved past the pinned version: re-verify challenge 3's denial wording (403 ERR_PERMISSION_DENIED / 500 ERR_SECRET_GET) on the new runtime, then update the \`DAPR_RUNTIME_VERSION\` line in \`dapr-secrets/_setup/sandbox-setup.sh\` (\`tools/track-tester/ci/setup-dapr-secrets.sh\` reads the pin from there).`
              : `The dapr-secrets drift test **failed**.${setupLines.length ? ' (At least one leg also failed during setup; see the entries marked \`setup-failed\`.)' : ''}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              intro,
              ``,
              `**Failing legs (\`leg: challenge …\`):**`,
              details,
              ``,
              `- Run: ${runUrl}`,
              `- For a per-language index, download the \`robot-<lang>\` artifact and open \`report.html\` (every challenge listed; failures in red) or \`log.html\`.`,
              ``,
              `Download and open the report(s) for the failing leg(s):`,
              '```bash',
              downloadCmds,
              '```',
              ``,
              `_This issue is updated automatically each run._`,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'drift-report',
            });
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: match.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['drift-report'],
              });
            }
