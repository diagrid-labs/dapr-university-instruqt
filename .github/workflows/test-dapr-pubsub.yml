name: Test dapr-pubsub track

on:
  schedule:
    - cron: '45 6 * * *'   # Daily 06:45 UTC (staggered 15 min after dapr-workflow-aspire)
  workflow_dispatch:
  pull_request:
    paths:
      - 'dapr-pubsub/**'
      - 'tools/track-tester/**'
      - '.github/workflows/test-dapr-pubsub.yml'

permissions:
  contents: read
  issues: write

jobs:
  docsync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync harness
        run: (cd tools/track-tester && uv sync)
      - name: Check doc-sync for all challenges
        run: |
          cd tools/track-tester
          mkdir -p results
          # Check every challenge even if an earlier one drifts, so one report shows
          # all drift (the `if !` guard is exempt from `set -e`, so the loop continues).
          failed=""
          for ch in 1-subscriptions 2-cloudevents 3-bulk-publishing \
                    4-routing 5-dead-lettering; do
            if ! uv run python docsync/check_doc_sync.py \
              ../../dapr-pubsub/$ch/assignment.md \
              ../../dapr-pubsub/$ch/tests/challenge.robot; then
              failed="$failed $ch"
            fi
          done
          if [ -n "$failed" ]; then
            echo "docsync:$failed" > results/failed-docsync.txt
            echo "::error::doc-sync drift in:$failed"
            exit 1
          fi
      - name: Upload doc-sync failure summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failures-docsync
          path: tools/track-tester/results/failed-docsync.txt
          if-no-files-found: ignore

  run-demos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Every project in dapr-pub-sub-deep-dive targets net10.0.
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Setup Dapr sandbox
        run: bash tools/track-tester/ci/setup-dapr-pubsub.sh
      - name: Sync harness
        run: (cd tools/track-tester && uv sync)
      - name: Run dapr-pubsub track suites
        run: |
          cd tools/track-tester
          mkdir -p results
          uv run robot --outputdir results --name "dapr-pubsub" \
            ../../dapr-pubsub/*/tests/challenge.robot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-pubsub
          path: tools/track-tester/results/

  report:
    needs: [docsync, run-demos]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = 'Dapr Pub/Sub track drift detected';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The dapr-pubsub drift test **failed**.`,
              ``,
              `- Run: ${runUrl}`,
              `- Download the \`robot-pubsub\` artifact and open \`report.html\` (every challenge listed; failures in red) or \`log.html\`.`,
              `- If the \`docsync\` job failed, download \`failures-docsync\` for the list of challenges whose assignment commands are no longer covered by their suite.`,
              ``,
              `Download and open the report:`,
              '```bash',
              `gh run download ${context.runId} -n robot-pubsub -D ./report-pubsub`,
              '```',
              ``,
              `_This issue is updated automatically each run._`,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'drift-report',
            });
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: match.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['drift-report'],
              });
            }
