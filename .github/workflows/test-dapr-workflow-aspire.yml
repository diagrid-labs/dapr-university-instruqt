name: Test dapr-workflow-aspire track

# Required checks for the branch ruleset: exactly `lab-validate` (lab-validate.yml) and
# `dapr-workflow-aspire-result` (the aggregate job below). Do NOT require `docsync` or
# `build-and-run`: a job skipped by a job-level `if` reports no result the ruleset can wait on.

on:
  schedule:
    - cron: '30 6 * * *'  # Daily 06:30 UTC (staggered after dapr-101 06:00, dapr-workflow 06:15)
  workflow_dispatch:
  # No `paths` filter: docsync and build-and-run feed a required check, and a required check from a
  # workflow that never started (path filter) blocks the merge. Instead the `changes` job decides,
  # and the jobs it gates are reported as Skipped, which satisfies a required check.
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # paths-filter lists the PR's files through the API; the workflow default is contents: read only.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      # On pull_request, dorny/paths-filter asks the API for the changed files, so no checkout.
      # If it errors, treat the change as relevant: running the tests is safe, skipping them is not.
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          filters: |
            relevant:
              - 'dapr-workflow-aspire/**'
              - 'modules/dapr-sandbox/**'
              - 'tools/track-tester/**'
              - '.github/workflows/test-dapr-workflow-aspire.yml'

  docsync:
    needs: changes
    # Skipped (not pending) on pull requests that touch nothing relevant; always runs for
    # schedule and workflow_dispatch. `!= 'false'` (not `== 'true'`) so an empty output, e.g. the
    # filter step erroring, runs the tests rather than skipping them.
    if: github.event_name != 'pull_request' || needs.changes.outputs.relevant != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync harness
        run: (cd tools/track-tester && uv sync)
      - name: Check doc-sync for all pages
        run: |
          cd tools/track-tester
          mkdir -p results
          # Check every page even if an earlier one drifts, so one report shows all drift (the
          # `if !` guard is exempt from `set -e`, so the loop continues).
          # --require-anchored-cd: a 2.0 lab's terminals keep their folder across pages, so a page
          # must go to the lab folder (absolute `cd`) before any relative `cd` in a Run block.
          # A heredoc Run block is one command; the suite covers it with its whole text.
          failed=""
          for ch in 1-create-the-solution 2-write-the-workflow 3-orchestrate-with-aspire \
                    4-run-and-inspect; do
            suite="../../dapr-workflow-aspire/$ch/tests/challenge.robot"
            if [ ! -f "$suite" ]; then
              # Every page has a suite; a missing one is drift, not a page to skip.
              echo "::error::$ch has no suite ($suite)"
              failed="$failed $ch"
              continue
            fi
            if ! uv run python docsync/check_doc_sync.py --require-anchored-cd \
              "../../dapr-workflow-aspire/$ch/assignment.md" "$suite"; then
              failed="$failed $ch"
            fi
          done
          if [ -n "$failed" ]; then
            # Record for the aggregate issue, then fail the job.
            echo "docsync:$failed" > results/failed-docsync.txt
            echo "::error::doc-sync drift in:$failed"
            exit 1
          fi
      - name: Upload doc-sync failure summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failures-docsync
          path: tools/track-tester/results/failed-docsync.txt
          if-no-files-found: ignore

  # One leg, not a language matrix: the lab is .NET only, and the pages build one app, so the
  # suites run in page order in one job (each leaves the solution in its page's end state).
  build-and-run:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.relevant != 'false'
    runs-on: ubuntu-latest
    # Bounds a hung `dapr init`, NuGet restore or `aspire run` so a stuck run costs 45 minutes of
    # runner time rather than the 6-hour default. A timeout that still fires is recorded by
    # `Record timeout` below.
    timeout-minutes: 45
    env:
      # The demo repo is checked out INSIDE the workspace (next steps); its workflow-aspire/ folder
      # is the workspace the suites build the solution in. ci/setup-dapr-workflow-aspire.sh skips
      # its own clone when this directory already holds a checkout.
      TRACKS_SRC_DIR: ${{ github.workspace }}/university-labs
    steps:
      - uses: actions/checkout@v4
      # The lab (dapr-workflow-aspire/versions.hcl, `tracks_src_ref`) and this CI check out the
      # SAME commit, so what CI tests is what learners get. The pin lives only in versions.hcl.
      - name: Read demo pin
        id: pin
        run: echo "ref=$(python3 tools/track-tester/ci/read_pin.py dapr-workflow-aspire/versions.hcl tracks_src_ref)" >> "$GITHUB_OUTPUT"
      # Toolchain versions come from the sandbox module so CI tests what the image ships.
      - name: Read toolchain pins
        id: toolchain
        run: echo "dotnet=$(python3 tools/track-tester/ci/read_pin.py modules/dapr-sandbox/versions.hcl dotnet_sdk_channel)" >> "$GITHUB_OUTPUT"
      # The demo repo is public, so the default GITHUB_TOKEN is sufficient; no PAT is needed.
      - uses: actions/checkout@v4
        with:
          repository: diagrid-labs/university-labs
          ref: ${{ steps.pin.outputs.ref }}
          path: university-labs
      - uses: astral-sh/setup-uv@v5
      # The runner image ships newer .NET SDKs in /usr/share/dotnet (11.0 on ubuntu-latest), and
      # without a global.json the dotnet muxer picks the highest one, so `dotnet new web` would target
      # net11.0 and build to bin/Debug/net11.0. The VM has only dotnet-sdk-<channel> (the module's
      # dotnet_sdk_channel). DOTNET_INSTALL_DIR puts the pinned SDK in its own root, which
      # setup-dotnet makes DOTNET_ROOT and puts first on PATH, so the muxer sees that SDK only.
      - name: Set up .NET
        id: dotnet
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: '${{ steps.toolchain.outputs.dotnet }}.x'
      - name: Check the .NET SDK is the pinned channel
        id: dotnetpin
        shell: bash
        env:
          CHANNEL: ${{ steps.toolchain.outputs.dotnet }}
        run: |
          echo "dotnet: $(command -v dotnet), DOTNET_ROOT=$DOTNET_ROOT"
          dotnet --list-sdks
          v="$(dotnet --version)"
          case "$v" in
            "$CHANNEL".*) echo "dotnet --version: $v (channel $CHANNEL)" ;;
            *) echo "ERROR: dotnet --version is $v, not the pinned channel $CHANNEL"; exit 1 ;;
          esac
      # Installs the Aspire CLI at the lab's pin (aspire_cli_version, read with read_pin.py) and the
      # Dev Dashboard binary at the module's pin (dev_dashboard_version), puts both first on PATH,
      # runs a full `dapr init` (Docker is preinstalled on ubuntu-latest), then fails if the runtime
      # that came up is not the pinned MAJOR.MINOR. Output is teed so the failing reason can be
      # recorded.
      - name: Setup Dapr and Aspire sandbox
        id: setup
        shell: bash
        run: |
          mkdir -p tools/track-tester/results
          bash tools/track-tester/ci/setup-dapr-workflow-aspire.sh 2>&1 | tee tools/track-tester/results/setup.log
      - name: Sync harness
        id: sync
        run: (cd tools/track-tester && uv sync)
      # Any failure BEFORE the run step writes no failed-build-and-run.txt, so the report job would
      # open an issue with no cause in it. Record one here. Conditioned on failure() || cancelled()
      # so a cancelled step (e.g. one killed by a timeout) is recorded too. It sits before the run
      # step, so it cannot fire for an ordinary test failure.
      - name: Record pre-test failure
        if: failure() || cancelled()
        shell: bash
        env:
          OUTCOMES: >-
            Set-up-.NET=${{ steps.dotnet.outcome }}
            Check-the-.NET-SDK-is-the-pinned-channel=${{ steps.dotnetpin.outcome }}
            Setup-Dapr-and-Aspire-sandbox=${{ steps.setup.outcome }}
            Sync-harness=${{ steps.sync.outcome }}
        run: |
          mkdir -p tools/track-tester/results
          step=""
          for o in $OUTCOMES; do
            case "${o#*=}" in success|skipped|"") ;; *) step="${o%%=*}"; break ;; esac
          done
          step="${step//-/ }"
          reason=""
          if [ "$step" = "Setup Dapr and Aspire sandbox" ]; then
            # The script's first `ERROR:` line; for the runtime guard it names both versions.
            reason="$(grep -m1 '^ERROR:' tools/track-tester/results/setup.log 2>/dev/null || true)"
          fi
          [ -n "$reason" ] || reason="step '${step:-unknown}' did not succeed; see its log"
          # Reasons are rendered inside backticks in the issue; neutralise any backtick.
          reason="${reason//\`/\'}"
          echo "build-and-run: setup-failed: $reason" > tools/track-tester/results/failed-build-and-run.txt
          echo "::error::Pre-test failure: $reason"
      - name: Run the dapr-workflow-aspire pages in order
        run: |
          cd tools/track-tester
          mkdir -p results
          # The four page suites, in page order. Every page has one: a missing suite fails the job.
          suites=""
          for ch in 1-create-the-solution 2-write-the-workflow 3-orchestrate-with-aspire \
                    4-run-and-inspect; do
            suite="../../dapr-workflow-aspire/$ch/tests/challenge.robot"
            if [ ! -f "$suite" ]; then
              echo "::error::$ch has no suite ($suite)"
              echo "build-and-run: missing-suite $ch" > results/failed-build-and-run.txt
              exit 1
            fi
            suites="$suites $suite"
          done
          # Run every page even if an earlier one fails, so a single run reports all failing pages
          # (the `if !` guard is exempt from `set -e`). Each suite rebuilds the earlier pages from
          # their assignments when the solution is missing. Fail the job at the end if any failed.
          failed=""
          for suite in $suites; do
            page="$(basename "$(dirname "$(dirname "$suite")")")"
            if ! uv run robot --outputdir "results/${page%%-*}" "$suite"; then
              failed="$failed $page"
            fi
          done
          # Merge the per-page results into one indexed report. `|| true` because rebot's exit code
          # reflects test failures too.
          uv run rebot --outputdir results --output output.xml --name "dapr-workflow-aspire" \
            results/[0-9]*/output.xml || true
          # Guard against a green run that tested nothing (a suite that crashed before running its
          # tests, a Skip): the merged result must hold exactly as many tests as a dry run of the
          # same suites, none skipped.
          # shellcheck disable=SC2086  # $suites is several words by design
          uv run robot --dryrun --output results/expected.xml --log NONE --report NONE $suites > /dev/null || true
          if ! uv run python - results/expected.xml results/output.xml <<'PY'
          import sys
          from robot.api import ExecutionResult
          exp = ExecutionResult(sys.argv[1]).statistics.total
          got = ExecutionResult(sys.argv[2]).statistics.total
          print(f"expected {exp.total} tests, merged result has {got.total} (passed {got.passed}, failed {got.failed}, skipped {got.skipped})")
          ok = exp.total > 0 and got.total == exp.total and got.skipped == 0
          sys.exit(0 if ok else 1)
          PY
          then
            echo "::error::Test count mismatch: no tests ran, the count differs from the dry run, or a test was skipped"
            failed="$failed count-mismatch"
          fi
          if [ -n "$failed" ]; then
            # Record for the aggregate issue, then fail the job.
            echo "build-and-run:$failed" > results/failed-build-and-run.txt
            echo "::error::Failed pages:$failed"
            exit 1
          fi
      # The run step is the one that hits the job timeout, and `Record pre-test failure` above has
      # already been evaluated (and skipped) by then. Do not overwrite a record the run step wrote.
      - name: Record timeout
        if: cancelled()
        shell: bash
        run: |
          mkdir -p tools/track-tester/results
          f=tools/track-tester/results/failed-build-and-run.txt
          [ -s "$f" ] || echo "build-and-run: timed-out: the job exceeded its time budget" > "$f"
          echo "::error::build-and-run exceeded its time budget"
      # The Aspire CLI writes its own logs (AppHost start-up, DCP, resource state) to
      # ~/.aspire/logs. Copy them next to the robot results so the artifact holds them.
      - name: Collect Aspire CLI logs
        if: always()
        run: |
          mkdir -p tools/track-tester/results/aspire-cli-logs
          cp -r "$HOME/.aspire/logs/." tools/track-tester/results/aspire-cli-logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-build-and-run
          path: tools/track-tester/results/
          if-no-files-found: ignore

  # Single result for the required check. Succeeds when the gated jobs passed or were skipped
  # (irrelevant PR); fails on any failure or cancellation. Not a dependency of `report`.
  dapr-workflow-aspire-result:
    needs: [changes, docsync, build-and-run]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any gated job failed or was cancelled
        env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.docsync.result }} ${{ needs['build-and-run'].result }}
        run: |
          echo "changes/docsync/build-and-run: $RESULTS"
          for r in $RESULTS; do
            case "$r" in failure|cancelled) echo "::error::a dapr-workflow-aspire job ended as $r"; exit 1 ;; esac
          done

  report:
    needs: [docsync, build-and-run]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download failure summaries
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            // Each failing job wrote a `failed-<job>.txt` (e.g. "build-and-run: 3-orchestrate-with-aspire")
            // into its artifact; gather them so the issue names the exact failures.
            const lines = [];
            const root = 'artifacts';
            const walk = (dir) => {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const p = path.join(dir, entry.name);
                if (entry.isDirectory()) walk(p);
                else if (/^failed-.*\.txt$/.test(entry.name)) {
                  const txt = fs.readFileSync(p, 'utf8').trim();
                  if (txt) lines.push(txt);
                }
              }
            };
            if (fs.existsSync(root)) walk(root);
            lines.sort();
            const details = lines.length
              ? lines.map(l => `  - \`${l.replace(/`/g, "'")}\``).join('\n')
              : '  - (no per-page detail captured — check the failing job logs)';
            const hasRun = lines.some(l => l.startsWith('build-and-run'));
            const downloadCmds = hasRun
              ? `gh run download ${context.runId} -n robot-build-and-run -D ./report-aspire`
              : '# doc-sync failure only: no robot report; see the docsync job log';
            // A setup failure (runtime guard, Aspire CLI install) is not drift in the assignments;
            // give it its own title and intro so a maintainer can tell them apart.
            const setupLines = lines.filter(l => l.includes('setup-failed'));
            const setupOnly = lines.length > 0 && setupLines.length === lines.length;
            const title = setupOnly
              ? 'Dapr Workflow Aspire track setup failed'
              : 'Dapr Workflow Aspire track drift detected';
            const intro = setupOnly
              ? `The dapr-workflow-aspire build-and-run job **failed before any page ran**, so nothing was tested. The assignments may be fine: this is the environment, the Aspire CLI install, or Dapr itself has moved. If the reason names a runtime newer than the pin, that is the intended signal that Dapr moved past the pinned version: re-verify the pages on the new runtime, then update \`dapr_runtime_version\` (and \`prewarm_dapr_runtime_version\` in \`modules/dapr-sandbox/versions.hcl\`) in \`dapr-workflow-aspire/versions.hcl\` (\`tools/track-tester/ci/setup-dapr-workflow-aspire.sh\` reads the pins from there).`
              : `The dapr-workflow-aspire drift test **failed**.${setupLines.length ? ' (The job also failed during setup; see the entry marked \`setup-failed\`.)' : ''}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              intro,
              ``,
              `**Failing jobs (\`job: page …\`):**`,
              details,
              ``,
              `- Run: ${runUrl}`,
              `- Download the \`robot-build-and-run\` artifact and open \`report.html\` (every page listed; failures in red) or \`log.html\`. \`aspire-cli-logs/\` holds the Aspire CLI logs.`,
              ``,
              `Download and open the report:`,
              '```bash',
              downloadCmds,
              '```',
              ``,
              `_This issue is updated automatically each run._`,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'drift-report',
            });
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: match.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['drift-report'],
              });
            }

  # The other half of `report`: a scheduled or manual run on main where the suites passed closes
  # the issue `report` opened, so a fixed drift does not leave a stale issue behind. PR runs never
  # close it: a PR branch passing says nothing about main. Matches the exact titles `report` uses,
  # so other tracks' drift-report issues are left alone.
  close-report:
    needs: [docsync, build-and-run]
    if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const titles = ['Dapr Workflow Aspire track drift detected', 'Dapr Workflow Aspire track setup failed'];
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'drift-report',
            });
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            for (const issue of open.filter(i => titles.includes(i.title))) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                body: `Closing automatically: the dapr-workflow-aspire drift test passed on \`main\` in ${runUrl}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                state: 'closed', state_reason: 'completed',
              });
              core.info(`Closed #${issue.number} (${issue.title})`);
            }
